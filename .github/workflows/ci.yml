name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "stable"]
    steps:
      - name: Check out pawn-project
        uses: actions/checkout@v7
        with:
          path: pawn-project

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        working-directory: pawn-project
        run: go build ./...

      - name: Vet
        working-directory: pawn-project
        run: go vet ./...

      - name: gofmt check
        working-directory: pawn-project
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go mod tidy check
        working-directory: pawn-project
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test (race, shuffled)
        working-directory: pawn-project
        env:
          CGO_ENABLED: "1"
        run: go test -race -shuffle=on ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out pawn-project
        uses: actions/checkout@v7
        with:
          path: pawn-project

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: pawn-project

  corpus:
    name: corpus conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out pawn-project
        uses: actions/checkout@v7
        with:
          path: pawn-project

      - name: Check out pawn-corpus
        uses: actions/checkout@v7
        with:
          repository: pawnkit/pawn-corpus
          ref: 43cee425a3a528d1b71d4e2a24eb250b7df62d59
          path: pawn-corpus

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Run corpus-backed tests
        working-directory: pawn-project
        env:
        PAWN_CORPUS_DIR: ${{ github.workspace }}/pawn-corpus
        run: go test -count=1 ./...

  benchmarks:
    name: benchmark history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Benchmark head
        run: go test -run '^$' -bench '^Benchmark' -benchmem -benchtime=1x -count=6 ./project ./include | tee benchmark-head.txt
      - name: Benchmark pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/pawn-project-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/pawn-project-base"
          go test -run '^$' -bench '^Benchmark' -benchmem -benchtime=1x -count=6 ./project ./include | tee benchmark-base.txt
      - name: Compare pull request benchmark
        if: github.event_name == 'pull_request'
        run: |
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260709024250-82a0b07e230d \
            "$RUNNER_TEMP/pawn-project-base/benchmark-base.txt" benchmark-head.txt | tee benchmark-comparison.txt
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pawn-project-benchmarks
          path: benchmark-*.txt
          if-no-files-found: warn

  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pawnkit/pawn-actions/support-check@v1.8.72
        with:
          repository: pawnkit/pawn-project
          targets: linux-amd64
