name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "stable"]
    steps:
      - name: Check out pawn-project
        uses: actions/checkout@v7
        with:
          path: pawn-project

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        working-directory: pawn-project
        run: go build ./...

      - name: Vet
        working-directory: pawn-project
        run: go vet ./...

      - name: gofmt check
        working-directory: pawn-project
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go mod tidy check
        working-directory: pawn-project
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test (race, shuffled)
        working-directory: pawn-project
        env:
          CGO_ENABLED: "1"
        run: go test -race -shuffle=on ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out pawn-project
        uses: actions/checkout@v7
        with:
          path: pawn-project

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: pawn-project

  corpus:
    name: corpus conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out pawn-project
        uses: actions/checkout@v7
        with:
          path: pawn-project

      - name: Check out pawn-corpus
        uses: actions/checkout@v7
        with:
          repository: pawnkit/pawn-corpus
          ref: 3ba7b8d930328c7c5ccc048e3420af16765c3641
          path: pawn-corpus

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Run corpus-backed tests
        working-directory: pawn-project
        env:
          PAWN_CORPUS_DIR: ${{ github.workspace }}/pawn-corpus
        run: go test -count=1 ./...

  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pawnkit/pawn-actions/support-check@v1.8.51
        with:
          repository: pawnkit/pawn-project
          targets: linux-amd64
